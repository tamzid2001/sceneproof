[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneproof"
version = "0.1.0"
description = "Counterfactual world-model verifier for robotics & embodied AI — Meta Global AI Hackathon 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sceneproof = "sceneproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sceneproof*"]

[tool.setuptools.package-data]
sceneproof = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
